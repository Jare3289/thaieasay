name: Deploy to Plesk (FTP)

# อัปโหลดไฟล์ขึ้นเซิร์ฟเวอร์ Plesk อัตโนมัติทุกครั้งที่โค้ดเข้า branch main
#
# ต้องตั้งค่า Secrets 3 ตัวใน GitHub ก่อน (Settings > Secrets and variables > Actions):
#   FTP_SERVER   — IP หรือชื่อโฮสต์ของเซิร์ฟเวอร์ Plesk
#   FTP_USERNAME — System user ของ subdomain
#   FTP_PASSWORD — รหัสผ่านของ System user ตัวนั้น
#
# ดูค่าจริงทั้งสามได้ที่ Plesk > Websites & Domains > Hosting Access
#
# ⚠️ ห้ามจดค่าจริงลงในไฟล์นี้หรือไฟล์ใด ๆ ใน repo แม้จะเขียนเป็นคอมเมนต์ก็ตาม
#    คอมเมนต์ถูกเผยแพร่พร้อมโค้ดเสมอ และ git เก็บทุกเวอร์ชันในอดีตไว้ถาวร
#    ลบทีหลังจึงไม่ช่วย — ถ้าหลุดแล้วต้องเปลี่ยนรหัสใน Plesk สถานเดียว
#
# หมายเหตุสำคัญ:
#   - ใช้บัญชี FTP เฉพาะงาน deploy (easay_deploy) ไม่ใช่ System user ของโฮสติ้ง
#     เพราะบัญชีนี้เข้าถึงได้เฉพาะโฟลเดอร์เว็บ ถ้ารหัสหลุดความเสียหายจึงจำกัดวงกว่ามาก
#   - server-dir สัมพันธ์กับ "Home directory" ของบัญชี FTP ที่ล็อกอิน
#     easay_deploy มี home = /thaiessay.chainatpit.com อยู่แล้ว จึงล็อกอินแล้วอยู่ใน
#     document root เลย ค่าที่ถูกต้องคือ ./ (ถ้าเปลี่ยนไปใช้ System user ต้องแก้กลับเป็น
#     ./thaiessay.chainatpit.com/ เพราะบัญชีนั้นล็อกอินที่ระดับบนสุดของบัญชีโฮสติ้ง)
#   - ไฟล์ db_secrets.php, google_secrets.php และ ai_secrets.php ถูก exclude ไว้
#     จึง "ไม่ถูกอัปโหลด" และ "ไม่ถูกลบ" ออกจากเซิร์ฟเวอร์ (รหัสลับปลอดภัย)

on:
  push:
    branches:
      - main
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # โฟลเดอร์ปลายทาง = จุดที่บัญชี FTP ล็อกอินเข้ามา (Home directory ของ easay_deploy
          # คือ /thaiessay.chainatpit.com ซึ่งเป็น document root อยู่แล้ว จึงใช้ ./ )
          server-dir: ./
          # ไม่อัปโหลด/ไม่ลบไฟล์เหล่านี้บนเซิร์ฟเวอร์
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            db_secrets.php
            google_secrets.php
            ai_secrets.php
            db_secrets.sample.php
            ai_secrets.sample.php
            MIGRATION.md
            AI_SETUP.md
            schema.sql
            migration_essay_split.sql
            migration_reflection_units.sql
            migration_ai_feedback.sql
            research_queries.sql
            test_db.php
            clean_temp.php
            verify_calculations.js
