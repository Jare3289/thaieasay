name: Deploy to Plesk (FTP)

# อัปโหลดไฟล์ขึ้นเซิร์ฟเวอร์ Plesk อัตโนมัติทุกครั้งที่โค้ดเข้า branch main
#
# ต้องตั้งค่า Secrets 3 ตัวใน GitHub ก่อน (Settings > Secrets and variables > Actions):
#   FTP_SERVER   = 14.207.141.86                 (IP เซิร์ฟเวอร์ Plesk)
#   FTP_USERNAME = chainatpit.com_iv4dxiaa9br    (System user / FTP username)
#   FTP_PASSWORD = ******                        (รหัสผ่าน System user / FTP — ห้ามใส่ค่าจริงในไฟล์นี้!)
#
# หมายเหตุสำคัญ:
#   - server-dir ต้องชี้ไปที่ document root ของ subdomain (โฟลเดอร์ thaiessay.chainatpit.com)
#   - ไฟล์ db_secrets.php และ google_secrets.php ถูก exclude ไว้
#     จึง "ไม่ถูกอัปโหลด" และ "ไม่ถูกลบ" ออกจากเซิร์ฟเวอร์ (รหัสลับปลอดภัย)

on:
  push:
    branches:
      - main
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # ขั้นตอนวินิจฉัยปัญหา FTP (ไม่เปิดเผยรหัสจริง)
      # ใช้ตรวจว่า Secrets ตั้งครบ/ไม่มีช่องว่างแฝง และเซิร์ฟเวอร์รับ
      # FTP ธรรมดา หรือบังคับ FTPS (TLS). อ่านค่า 220/230/331/530 ในล็อก
      #   230 = ล็อกอินผ่าน   |   530 = user/pass ผิด
      # continue-on-error: true = ให้รันต่อไปถึงขั้น deploy เสมอ
      # ---------------------------------------------------------------
      - name: Diagnose FTP connection
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "===== ตรวจค่า Secrets (โชว์แค่ความยาว ไม่โชว์ค่าจริง) ====="
          echo "FTP_SERVER   length = ${#FTP_SERVER}"
          echo "FTP_USERNAME length = ${#FTP_USERNAME}"
          echo "FTP_PASSWORD length = ${#FTP_PASSWORD}"
          # เตือนถ้าค่าว่างเปล่า
          [ -z "$FTP_SERVER" ]   && echo "!! FTP_SERVER ว่างเปล่า"
          [ -z "$FTP_USERNAME" ] && echo "!! FTP_USERNAME ว่างเปล่า"
          [ -z "$FTP_PASSWORD" ] && echo "!! FTP_PASSWORD ว่างเปล่า"
          # จับช่องว่าง/ขึ้นบรรทัดใหม่หัว-ท้าย (มักเป็นสาเหตุ 530 ที่มองไม่เห็น)
          case "$FTP_USERNAME" in *[[:space:]]) echo "!! FTP_USERNAME มีช่องว่างต่อท้าย" ;; esac
          case "$FTP_PASSWORD" in *[[:space:]]) echo "!! FTP_PASSWORD มีช่องว่างต่อท้าย" ;; esac

          echo ""
          echo "===== ลอง FTP ธรรมดา (พอร์ต 21) ====="
          curl -sv --connect-timeout 20 --ftp-method nocwd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" 2>&1 \
            | grep -Ei '^< (220|230|331|530|550)|denied|SSL|TLS|AUTH|refused|timed out' || true

          echo ""
          echo "===== ลอง FTPS แบบ Explicit (TLS บังคับ) ====="
          curl -sv --connect-timeout 20 --ssl-reqd --ftp-method nocwd -k \
            --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" 2>&1 \
            | grep -Ei '^< (220|230|331|530|550)|denied|SSL|TLS|AUTH|refused|timed out' || true

          echo ""
          echo "หมายเหตุ: ถ้า FTPS ขึ้น 230 แต่ FTP ธรรมดาขึ้น 530/ปิดกั้น"
          echo "         แปลว่าเซิร์ฟเวอร์บังคับ TLS -> ต้องใส่ protocol: ftps ในขั้น deploy"

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ถ้าผลวินิจฉัยบอกว่าเซิร์ฟเวอร์บังคับ TLS (FTPS ขึ้น 230 แต่ FTP ธรรมดา
          # โดนปิดกั้น) ให้เอา # ออกจากบรรทัดล่างนี้เพื่อบังคับใช้ FTPS แบบ explicit:
          # protocol: ftps
          # โฟลเดอร์ปลายทางบน Plesk = document root ของ subdomain
          # (ถ้า FTP login แล้วไม่ได้อยู่ที่ home ให้ปรับ path ตรงนี้)
          server-dir: ./thaiessay.chainatpit.com/
          # ไม่อัปโหลด/ไม่ลบไฟล์เหล่านี้บนเซิร์ฟเวอร์
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            db_secrets.php
            google_secrets.php
            db_secrets.sample.php
            MIGRATION.md
            schema.sql
            migration_essay_split.sql
            migration_reflection_units.sql
            research_queries.sql
            test_db.php
            clean_temp.php
            verify_calculations.js
