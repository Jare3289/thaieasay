name: Deploy to Plesk (FTP)

# อัปโหลดไฟล์ขึ้นเซิร์ฟเวอร์ Plesk อัตโนมัติทุกครั้งที่โค้ดเข้า branch main
#
# ต้องตั้งค่า Secrets 3 ตัวใน GitHub ก่อน (Settings > Secrets and variables > Actions):
#   FTP_SERVER   = 14.207.141.86                 (IP เซิร์ฟเวอร์ Plesk)
#   FTP_USERNAME = chainatpit.com_iv4dxiaa9br    (System user / FTP username)
#   FTP_PASSWORD = 1189900208011JR.                        (รหัสผ่าน System user / FTP)
#
# หมายเหตุสำคัญ:
#   - server-dir ต้องชี้ไปที่ document root ของ subdomain (โฟลเดอร์ thaiessay.chainatpit.com)
#   - ไฟล์ db_secrets.php และ google_secrets.php ถูก exclude ไว้
#     จึง "ไม่ถูกอัปโหลด" และ "ไม่ถูกลบ" ออกจากเซิร์ฟเวอร์ (รหัสลับปลอดภัย)

on:
  push:
    branches:
      - main
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # โฟลเดอร์ปลายทางบน Plesk = document root ของ subdomain
          # (ถ้า FTP login แล้วไม่ได้อยู่ที่ home ให้ปรับ path ตรงนี้)
          server-dir: ./thaiessay.chainatpit.com/
          # ไม่อัปโหลด/ไม่ลบไฟล์เหล่านี้บนเซิร์ฟเวอร์
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            db_secrets.php
            google_secrets.php
            db_secrets.sample.php
            MIGRATION.md
            schema.sql
            migration_essay_split.sql
            migration_reflection_units.sql
            research_queries.sql
            test_db.php
            clean_temp.php
            verify_calculations.js
